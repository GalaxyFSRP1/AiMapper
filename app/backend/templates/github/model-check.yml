name: Model check

# Called by AiMapper Model Studio straight after a generation, and by hand.
# Verifies that the committed artifacts are internally consistent and reports
# the real parameter count back to the run summary.

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: "Model name"
        required: false
        default: ""
      expected_parameters:
        description: "Expected trainable parameters"
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install safetensors

      - name: Validate artifacts
        run: python validate.py --strict-target 0.02

      - name: Report parameter count
        run: |
          python - <<'PY'
          import json, os
          cfg = json.load(open("config.json"))
          report = json.load(open("validation-report.json"))
          total = report["analytic_parameters"]["total"]
          built = report.get("torch_built_parameters")
          expected = "${{ inputs.expected_parameters }}"
          lines = [
            "## MapperGPT model check",
            "",
            f"- model: `{cfg.get('model_name', '${{ inputs.model_name }}')}`",
            f"- analytic parameters: **{total:,}**",
            f"- built (torch) parameters: **{built:,}**" if isinstance(built, int) else "- built (torch) parameters: n/a",
            f"- tensors: {report['weights']['tensor_count']}",
            f"- weights bytes: {report['weights']['file_bytes']:,}",
            f"- status: **{report['status']}**",
          ]
          if expected and expected.isdigit() and int(expected) != total:
              lines.append(f"- ::error:: expected {int(expected):,} but found {total:,}")
              open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines))
              raise SystemExit(1)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          PY
